ted deliverable" required></textarea></label><div class="form-grid"><label>Payee<select name="payee" id="payee-select" required></select></label><label>Budget (NEAR)<input name="amount" type="number" min="0.0001" max="10000" step="0.0001" required></label></div><div id="form-error" role="alert"></div><button class="primary" type="submit">Create job ↗</button></form></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
