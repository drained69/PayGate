<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PayGate gives your AI agent a NEAR budget it cannot overspend. Limits are enforced on-chain, and you approve anything large in your own wallet."><title>PayGate — Give your AI agent a budget it can't overspend</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="/" data-page="Home"><span class="glyph">◒</span><span>paygate<span class="dot">.</span></span></a><nav aria-label="Main" id="nav"></nav><div class="top-right"><span class="pill" id="mode" hidden><span class="led"></span><span id="mode-text"></span></span><button class="primary small" data-action="signin" id="signin" hidden>Sign in with NEAR</button><button class="secondary small" data-action="logout" id="logout" hidden>Sign out</button></div></div></header><main><div id="content"></div></main><footer><div class="footer-inner"><span>PayGate · Limits enforced on NEAR</span><span class="footer-links"><button class="text-button" data-page="Docs">Docs</button><button class="text-button" data-page="Terms">Terms</button><button class="text-button" data-page="Privacy">Privacy</button><a class="text-button" href="https://github.com/drained69/PayGate" target="_blank" rel="noopener">GitHub</a></span><span id="footer-mode"></span></div></footer><dialog id="job-dialog"><form id="job-form"><div class="dialog-heading"><h2>Create a job</h2><button type="button" class="close" aria-label="Close">×</button></div><p>Describe the work, who is paid and the budget. The agent can only pay accounts on the vault's allowlist.</p><label>Job title<input name="title" maxlength="100" placeholder="e.g. Research competitor pricing" required></label><label>Brief<textarea name="brief" maxlength="2000" placeholder="Describe the expected deliverable, format and deadline" required></textarea></label><div class="form-grid"><label>Payee<select name="payee" id="payee-select" required></select></label><label>Budget (NEAR)<input name="amount" type="number" min="0.0001" max="10000" step="0.0001" required><span class="hint" id="budget-hint"></span></label></div><div id="form-error" role="alert"></div><div class="dialog-actions"><button class="primary" type="submit">Create job</button></div></form></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
